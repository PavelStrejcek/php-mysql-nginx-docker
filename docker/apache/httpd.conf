# Apache HTTP Server 2.4 configuration for PHP-FPM (mpm_event)
# Base image: httpd:2.4-alpine

ServerTokens Prod
ServerSignature Off

# Use the event MPM
LoadModule mpm_event_module modules/mod_mpm_event.so

# Core essentials
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so

# Proxy for PHP-FPM
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

# Default settings
User daemon
Group daemon

ServerName localhost
Listen 80

# Logging
ErrorLog /usr/local/apache2/logs/error.log
LogLevel warn
CustomLog /usr/local/apache2/logs/access.log combined

# Document root
DocumentRoot "/var/www/html/public"
<Directory "/var/www/html/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Serve static files directly; route everything else to index.php (if desired)
# For frameworks using front controllers, you may rely on .htaccess; the following
# RewriteRule is a common default when AllowOverride is Off.
<IfModule mod_rewrite.c>
    RewriteEngine On
    # Note: RewriteBase is only valid in per-directory context (.htaccess or <Directory>),
    # so we intentionally omit it at the server/vhost level here.
    # Skip existing files/directories
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    # Fallback to index.php
    RewriteRule ^ index.php [L]
</IfModule>

# PHP via FPM in the "php" service (container)
# Map all .php to php-fpm upstream (fastcgi)
# Use ProxyPassMatch for simplicity; SCRIPT_FILENAME must be set

# Ensure the default DirectoryIndex includes index.php
<IfModule mod_dir.c>
    DirectoryIndex index.php index.html
</IfModule>

# Handle PHP files through php-fpm at php:9000
# Note: The "php" hostname resolves via Docker compose network "app-net".
# Using FilesMatch + SetHandler instead of ProxyPassMatch to handle PHP files
# after mod_rewrite processing (e.g., when / is rewritten to index.php)
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# Define proxy settings for PHP-FPM
<IfModule mod_proxy_fcgi.c>
    # Set required env var for SCRIPT_FILENAME
    Define PHPFPM_DOCROOT "/var/www/html/public"
    <Proxy "fcgi://php:9000" enablereuse=on max=10>
    </Proxy>
</IfModule>

# MIME types
TypesConfig conf/mime.types

# Compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml
</IfModule>

# Security headers (basic)
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Static assets caching
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresDefault "access plus 1 hour"
    ExpiresByType image/ico "access plus 7 days"
    ExpiresByType image/png "access plus 7 days"
    ExpiresByType image/gif "access plus 7 days"
    ExpiresByType image/jpeg "access plus 7 days"
    ExpiresByType image/webp "access plus 7 days"
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType font/ttf "access plus 7 days"
    ExpiresByType font/woff "access plus 7 days"
    ExpiresByType font/woff2 "access plus 7 days"
</IfModule>

# Deny access to hidden files
<Directory "/var/www/html">
    <Files ".*">
        Require all denied
    </Files>
</Directory>

# Include optional extra configs if present
# IncludeOptional conf/extra/*.conf
