server {
    listen 80;
    server_name _;

    # Document root: point to your app's public directory
    root /var/www/html/public;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Recommended settings
    client_max_body_size 64m;
    sendfile on;

    # Serve static files, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling via FPM in the php service
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT  $realpath_root;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        try_files $uri =404;
    }

    # Cacheable static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    # Security: deny hidden files
    location ~ /\. {
        deny all;
    }
}
